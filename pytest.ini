[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

addopts =
    --verbose
    --strict-markers
    --cov=apps
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=85
    --disable-warnings

markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (DB required)
    e2e: End-to-end tests (slow)
    ai: Tests that use AI models (can be slow)

testpaths = tests

# Coverage settings
[coverage:run]
source = apps
omit =
    */migrations/*
    */tests/*
    */__init__.py
    */settings/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False